<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Hub - Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

  <!-- top bar: name, role, logout -->
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <div>
      <h1 class="brand">Internship Hub</h1>
      <p class="text-muted mb-3">Student page: browse and apply</p>
    </div>
    <div class="mb-3"><span id="whoami"></span> <button id="logoutBtn" class="btn btn-soft btn-sm ms-2">Logout</button></div>
  </div>

  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#browse">Browse &amp; Apply</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#mine">My Applications</button></li>
  </ul>

  <div class="tab-content">

    <!-- ================= TAB 1: BROWSE & APPLY ================= -->
    <div class="tab-pane fade show active" id="browse">
      <div class="card-soft mb-3">
        <h5>Your profile</h5>
        <div class="row g-2">
          <div class="col-md-4"><label class="form-label">Name</label><input id="name" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Qualification</label><input id="qualification" class="form-control" placeholder="B.Tech CSE"></div>
          <div class="col-md-4"><label class="form-label">Projects done</label><input id="projects" type="number" min="0" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Skills (comma separated)</label><input id="skills" class="form-control" placeholder="python, sql, git"></div>
          <div class="col-md-6"><label class="form-label">About you (one line)</label><input id="about" class="form-control"></div>
          <div class="col-12"><button id="saveBtn" class="btn btn-main">Save profile</button></div>
        </div>

        <!-- NOVELTY I: profile strength -->
        <div class="mt-3">
          <div class="progress"><div id="strengthBar" class="progress-bar" style="width:0%"></div></div>
          <small id="strengthText" class="text-muted">Profile 0% complete</small>
        </div>

        <!-- RESUME upload (PDF) -->
        <hr>
        <h6 class="mb-2">Your resume <span class="text-muted small">(PDF, max 2 MB, needed to apply)</span></h6>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <input id="resumeFile" type="file" accept="application/pdf,.pdf" class="form-control" style="max-width: 320px;">
          <button id="uploadBtn" class="btn btn-soft">Upload resume</button>
          <span id="resumeStatus" class="small text-muted">No resume uploaded yet.</span>
        </div>
      </div>

      <div id="cards" class="row g-3"></div>
    </div>

    <!-- ================= TAB 2: MY APPLICATIONS ================= -->
    <div class="tab-pane fade" id="mine">
      <div class="card-soft">
        <h5>Where do my applications stand?</h5>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Company</th><th>Role</th><th>Applied</th><th>Status</th><th>Note</th><th></th></tr></thead>
            <tbody id="myBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ===== pop-up window: Reality Card + Fit Meter + Apply ===== -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="dTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="dReality" class="reality mb-3"></div>

        <!-- NOVELTY A: Fit Meter -->
        <div class="mb-3">
          <strong>Your fit</strong>
          <div class="progress my-1"><div id="fitBar" class="progress-bar" style="width:0%"></div></div>
          <small id="fitText" class="text-muted"></small>
        </div>

        <!-- NOVELTY F: mini-task -->
        <div id="taskBox" class="mb-2">
          <label class="form-label"><strong>Optional mini-task:</strong> <span id="taskQ"></span></label>
          <textarea id="taskAnswer" class="form-control" rows="2" placeholder="A short answer can make your application stand out"></textarea>
        </div>

        <div class="small" id="dResume"></div>
      </div>
      <div class="modal-footer"><button id="applyBtn" class="btn btn-main">Apply with my resume</button></div>
    </div>
  </div>
</div>

<div id="toast">Done!</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script src="student.js"></script>
</body>
</html>
